<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 6</title>
    <!-- Liên kết file css -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- API (Application Programming Interface): Cách các ứng dụng giao tiếp với nhau -->
     <!-- Hiểu đơn giản: API giống người phục vụ trong nhà hàng -->

     <!-- Bài 1: Lấy dữ liệu từ API -->
    <h2>Todo list</h2>
        <!-- container chứa dữ liệu -->
    <div id="todo-list"></div>
    <br>
    
    <!-- Bài 2: Post list -->
    <h2>Post list</h2>
    <div id="post-list"></div>
    <br>

    <!-- =============== LOCAL STORAGE ================== -->
    <!-- Ý nghĩa: Cho phép lưu trữ dữ liệu trên trình duyệt người dùng -->
    <!-- Lưu ý: 
        - Chỉ lưu dưới dạng string
        - Nếu muốn lưu object/array => dùng JSON.stringify() và JSON.parse()
     -->
    <!-- Bài 3: Dark Mode / Light mode-->
    <h2>Dark Mode / Light mode</h2>
    <button id="themeBtn">Change Theme</button>
    <br><br>

    <!-- Bài 4: Note List -->
    <h2>Note list</h2>
    <input type="text" id="noteInput" placeholder="Nhập ghi chú">
    <button id="addNote">Thêm ghi chú</button> 
        <!-- container chứa các ghi chú -->
    <div id="note-list"></div>

    <!-- Liên kết file js -->
    <script src="./script.js"></script>
</body>
</html>
